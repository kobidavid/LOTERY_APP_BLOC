<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LotoGroup Invite</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #17171b;
        color: #f8f3f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 420px);
        padding: 24px;
        border-radius: 20px;
        background: #23232b;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }

      a.button {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 18px;
        border-radius: 999px;
        background: #f3b7cc;
        color: #111;
        font-weight: 800;
        text-decoration: none;
      }

      code {
        word-break: break-word;
        color: #ffd7e3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open your LotoGroup invite</h1>
      <p id="status">Preparing your invite link...</p>
      <a id="open-app" class="button" href="#">Open in app</a>
      <p id="details"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const groupId = params.get("groupId") || "";
      const inviteToken = params.get("inviteToken") || "";
      const status = document.getElementById("status");
      const details = document.getElementById("details");
      const openApp = document.getElementById("open-app");
      let customSchemeUrl = "";

      if (!groupId || !inviteToken) {
        status.textContent = "This invite link is missing required details.";
        openApp.style.display = "none";
        details.innerHTML = "<code>groupId</code> and <code>inviteToken</code> are required.";
      } else {
        customSchemeUrl =
          `lotogroup://join-group?groupId=${encodeURIComponent(groupId)}&inviteToken=${encodeURIComponent(inviteToken)}`;
        openApp.href = customSchemeUrl;
        status.textContent =
          "If the app is installed on this device, tap the button below to continue.";
        details.innerHTML =
          `Group: <code>${groupId}</code><br />Token: <code>${inviteToken}</code>`;
      }

      openApp.addEventListener("click", function (event) {
        if (!customSchemeUrl) {
          return;
        }

        event.preventDefault();
        window.location.href = customSchemeUrl;
      });
    </script>
  </body>
</html>
